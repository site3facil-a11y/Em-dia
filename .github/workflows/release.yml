name: Publicar release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Build e pacote
        run: |
          echo "legacy-peer-deps=true" > .npmrc
          npm install
          npm run build
          npm run bundle
      - name: Preparar site
        run: |
          mkdir site
          cp dist.zip site/dist.zip
          cp dist.zip "site/dist-${{ steps.v.outputs.version }}.zip"
          node -e "const fs=require('fs');const v=process.argv[1];const s=fs.statSync('dist.zip').size;fs.writeFileSync('site/version.json',JSON.stringify({version:v,url:'https://site3facil-a11y.github.io/Em-dia/dist-'+v+'.zip',size:s,notes:'Atualização '+v}))" "${{ steps.v.outputs.version }}"
          touch site/.nojekyll
      - name: Criar release se for nova
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.v.outputs.version }}"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Release $V já existe"
          else
            gh release create "$V" dist.zip --title "Em Dia ${{ steps.v.outputs.version }}" --notes "Atualização ${{ steps.v.outputs.version }}"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
