<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradê diagonal azul-noite -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Brilho suave índigo no centro -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#4338CA" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </radialGradient>

    <!-- Degradê suave da lua crescente (creme para dourado) -->
    <linearGradient id="moonGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Degradê do selo verde esmeralda -->
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Fundo quadrado cheio -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <rect width="512" height="512" fill="url(#centerGlow)" />

  <!-- Lua Crescente vetorial pura (sem máscaras, dois arcos) -->
  <path
    d="M 235 125 A 125 125 0 1 0 235 375 A 146 146 0 0 1 235 125 Z"
    fill="url(#moonGrad)"
  />

  <!-- Estrela 1 (maior, 4 pontas) -->
  <path
    d="M 326 142 Q 326 158 342 158 Q 326 158 326 174 Q 326 158 310 158 Q 326 158 326 142 Z"
    fill="#FFFBEB"
  />

  <!-- Estrela 2 (menor, 4 pontas) -->
  <path
    d="M 368 208 Q 368 219 379 219 Q 368 219 368 230 Q 368 219 357 219 Q 368 219 368 208 Z"
    fill="#FFFBEB"
    opacity="0.9"
  />

  <!-- Selo inferior direito: anel na cor do fundo para destaque -->
  <circle cx="348" cy="348" r="62" fill="#1E1B4B" />

  <!-- Círculo Verde Esmeralda -->
  <circle cx="348" cy="348" r="52" fill="url(#sealGrad)" />

  <!-- Check branco grosso e arredondado -->
  <path
    d="M 325 348 L 341 364 L 372 328"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
