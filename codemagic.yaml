workflows:
  ios-release:
    name: Em Dia - iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependências npm
        script: |
          npm install --legacy-peer-deps
      - name: Compilar aplicação Web (Vite)
        script: |
          npm run build
      - name: Sincronizar Capacitor iOS
        script: |
          npx @capacitor/cli sync ios
      - name: Configurar assinatura de código (Code Signing)
        script: |
          xcode-project use-profiles
      - name: Compilar IPA (iOS)
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - wilsinhofly@gmail.com
        notify:
          success: true
          failure: true
