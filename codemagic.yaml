workflows:
  ios-release:
    name: Em Dia - iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependências npm
        script: |
          npm install --legacy-peer-deps
      - name: Compilar aplicação Web (Vite)
        script: |
          npm run build
      - name: Sincronizar Capacitor iOS
        script: |
          npx @capacitor/cli sync ios
      - name: Configurar assinatura de código (Code Signing)
        script: |
          xcode-project use-profiles || echo "Perfis não encontrados no momento, continuando com configuração padrão do Xcode..."
      - name: Compilar IPA (iOS)
        script: |
          # Tenta gerar o IPA assinado caso perfis da Apple estejam cadastrados no Codemagic
          if xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"; then
            echo "IPA assinado com sucesso!"
          else
            echo "Sem perfil Apple configurado. Compilando pacote de distribuição sem assinatura..."
            xcodebuild archive \
              -project "ios/App/App.xcodeproj" \
              -scheme "App" \
              -archivePath "build/ios/xcarchive/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

            mkdir -p "build/ios/ipa"
            cd build/ios/xcarchive
            zip -r "../ipa/Em-dia-unsigned-archive.zip" App.xcarchive
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.zip
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - wilsinhofly@gmail.com
        notify:
          success: true
          failure: true
