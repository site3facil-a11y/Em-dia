<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Degradê diagonal: Azul marinho profundo para índigo e azul meia-noite -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Folha do calendário branco puro e límpido -->
    <linearGradient id="calendarSheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Sombra sutil e elegante para o calendário flutuar sobre o fundo -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.55" />
    </filter>

    <!-- Brilho no checkmark em verde esmeralda (#10B981) -->
    <filter id="emeraldGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo: Quadrado com cantos arredondados e degradê diagonal -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Calendário Central (Minimalista Branco) com Margem de Segurança -->
  <g filter="url(#cardShadow)">
    <!-- Folha do Calendário -->
    <rect
      x="136"
      y="148"
      width="240"
      height="236"
      rx="40"
      fill="url(#calendarSheet)"
    />

    <!-- Faixa Superior Discreta do Calendário -->
    <path
      d="M 136,188 C 136,166 154,148 176,148 L 336,148 C 358,148 376,166 376,188 L 376,204 L 136,204 Z"
      fill="#f1f5f9"
    />
    <line
      x1="136"
      y1="204"
      x2="376"
      y2="204"
      stroke="#e2e8f0"
      stroke-width="2"
    />
  </g>

  <!-- Duas Pequenas Argolas no Topo -->
  <!-- Argola Esquerda -->
  <rect
    x="188"
    y="126"
    width="20"
    height="46"
    rx="10"
    fill="#94a3b8"
    stroke="#ffffff"
    stroke-width="2.5"
  />
  <circle cx="198" cy="172" r="4.5" fill="#cbd5e1" />

  <!-- Argola Direita -->
  <rect
    x="304"
    y="126"
    width="20"
    height="46"
    rx="10"
    fill="#94a3b8"
    stroke="#ffffff"
    stroke-width="2.5"
  />
  <circle cx="314" cy="172" r="4.5" fill="#cbd5e1" />

  <!-- Checkmark (✓) Grande e Grosso em Verde Esmeralda (#10B981) -->
  <path
    d="M 194,284 L 238,328 L 322,236"
    fill="none"
    stroke="#10b981"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#emeraldGlow)"
  />
</svg>
